name: Update names dataset
on:
  # Twice a day, so a late or failed run still leaves the dataset at most a day behind:
  # 07:05 and 14:05 Paris in winter (08:05 and 15:05 in summer). The :05 offset avoids the
  # top-of-hour congestion that delays scheduled runs. Each run builds from the latest
  # cvelistV5 release: the midnight snapshot plus that release's delta since midnight.
  schedule:
    - cron: "5 6 * * *"
    - cron: "5 13 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Build from scratch when the dataset release has no files yet (first publish only)"
        type: boolean
        default: false

permissions:
  contents: write

# Two overlapping runs would each name the same new CVEs from the same previous dataset,
# and the second upload would overwrite names the first one just published.
concurrency:
  group: nightly-dataset
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install ".[model]"
      - name: Fetch model and the previous dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model-v1 --pattern 'vulnamer-model.tar.gz'
          mkdir model && tar -xzf vulnamer-model.tar.gz -C model
          # Published names are append-only, so the previous dataset is required. Start from
          # scratch only when nothing was ever published; any other failure stops the build.
          if ! assets=$(gh release view dataset --json assets --jq '.assets[].name' 2>&1); then
            if grep -q "release not found" <<<"$assets"; then
              echo "::warning::no dataset release yet, building from scratch"
              exit 0
            fi
            echo "$assets"; exit 1
          fi
          # A release without its files means a publish failed half-way: rebuilding from
          # scratch would re-resolve every name, so it needs an explicit bootstrap run.
          for file in vuln_names.jsonl.gz vuln_names.min.jsonl.gz; do
            if ! grep -qx "$file" <<<"$assets"; then
              if [ "${{ inputs.bootstrap }}" = "true" ]; then
                echo "::warning::the dataset release has no $file, bootstrapping from scratch"
                exit 0
              fi
              echo "::error::the dataset release has no $file; restore it, or re-run with bootstrap=true"
              exit 1
            fi
          done
          gh release download dataset --pattern 'vuln_names.jsonl.gz' --output previous.jsonl.gz
          gh release download dataset --pattern 'vuln_names.min.jsonl.gz' --output previous.min.jsonl.gz
          gzip -t previous.jsonl.gz previous.min.jsonl.gz
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS=""
          if [ -f previous.jsonl.gz ]; then PREVIOUS="--previous previous.jsonl.gz"; fi
          vulnamer build vuln_names.jsonl.gz --names vuln_names.min.jsonl.gz --model model $PREVIOUS
      - name: Check published names are unchanged
        if: hashFiles('previous.jsonl.gz') != ''
        run: |
          vulnamer check-stable previous.jsonl.gz vuln_names.jsonl.gz
          # consumers read the min file: check it on its own too
          vulnamer check-stable previous.min.jsonl.gz vuln_names.min.jsonl.gz
      - name: Checksums and manifest
        run: |
          sha256sum vuln_names.jsonl.gz vuln_names.min.jsonl.gz > SHA256SUMS
          python - <<'PY'
          import datetime, gzip, hashlib, json

          def rows(path):
              with gzip.open(path, "rt", encoding="utf-8") as lines:
                  return [json.loads(line) for line in lines]

          def sha256(path):
              with open(path, "rb") as handle:
                  return hashlib.file_digest(handle, "sha256").hexdigest()

          full = rows("vuln_names.jsonl.gz")
          names = rows("vuln_names.min.jsonl.gz")
          manifest = {
              "schema_version": 1,
              "built_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "counts": {
                  "records": len(full),
                  "named": len(names),
                  "with_public_name": sum(1 for row in names if row.get("public_name")),
              },
              "files": {
                  path: {"sha256": sha256(path)}
                  for path in ("vuln_names.jsonl.gz", "vuln_names.min.jsonl.gz")
              },
          }
          with open("manifest.json", "w") as output:
              json.dump(manifest, output, indent=2)
              output.write("\n")
          PY
          cat SHA256SUMS manifest.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dataset >/dev/null 2>&1 || gh release create dataset --latest=false --title "Names dataset" --notes "Nightly names dataset."
          # data files first, then the checksums and manifest that describe them
          gh release upload dataset vuln_names.jsonl.gz vuln_names.min.jsonl.gz --clobber
          gh release upload dataset SHA256SUMS manifest.json --clobber
